<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Banking Products Dashboard</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-soft: #eef3f8;
        --ink: #17202a;
        --muted: #667085;
        --line: #d9e2ec;
        --brand: #006d77;
        --brand-dark: #034f56;
        --accent: #b7791f;
        --positive: #16803c;
        --warning: #a15c00;
        --paused: #6b7280;
        --shadow: 0 18px 45px rgba(23, 32, 42, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          linear-gradient(180deg, rgba(0, 109, 119, 0.08), transparent 320px),
          var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        box-shadow: 0 10px 25px rgba(0, 109, 119, 0.28);
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.55rem, 2.5vw, 2.35rem);
        line-height: 1.1;
      }

      .brand p {
        margin: 5px 0 0;
        color: var(--muted);
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 22px;
      }

      .summary-item {
        min-height: 96px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 8px 24px rgba(23, 32, 42, 0.05);
      }

      .summary-label {
        margin: 0 0 9px;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .summary-value {
        margin: 0;
        font-size: 1.45rem;
        font-weight: 800;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(240px, 1fr) auto;
        gap: 14px;
        align-items: center;
        margin-bottom: 20px;
      }

      .search {
        position: relative;
      }

      .search svg {
        position: absolute;
        left: 14px;
        top: 50%;
        width: 18px;
        height: 18px;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
      }

      .search input {
        width: 100%;
        height: 46px;
        padding: 0 14px 0 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        outline: none;
      }

      .search input:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(0, 109, 119, 0.16);
      }

      .filters {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .filter-button {
        height: 40px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--muted);
        cursor: pointer;
        white-space: nowrap;
      }

      .filter-button:hover {
        border-color: var(--brand);
        color: var(--brand-dark);
      }

      .filter-button.active {
        border-color: var(--brand);
        background: var(--brand);
        color: #fff;
      }

      .products {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .product-card {
        display: flex;
        min-height: 286px;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .icon {
        display: grid;
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
        place-items: center;
        border-radius: 8px;
        background: var(--surface-soft);
        color: var(--brand);
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 800;
      }

      .status.active {
        background: #e4f6ea;
        color: var(--positive);
      }

      .status.pending {
        background: #fff4df;
        color: var(--warning);
      }

      .status.paused {
        background: #eef0f3;
        color: var(--paused);
      }

      .category {
        margin: 18px 0 8px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .product-card h2 {
        margin: 0;
        font-size: 1.25rem;
        line-height: 1.25;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin: 18px 0;
      }

      .metric {
        min-height: 78px;
        padding: 12px;
        border-radius: 8px;
        background: #f8fafc;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
      }

      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 1.05rem;
      }

      .card-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .updated {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .cta {
        min-height: 40px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
        font-weight: 800;
      }

      .cta:hover {
        background: var(--brand-dark);
      }

      .empty {
        display: none;
        padding: 34px 20px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.75);
        color: var(--muted);
        text-align: center;
      }

      .empty.visible {
        display: block;
      }

      @media (max-width: 920px) {
        .summary,
        .products {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .toolbar {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100% - 22px, 1180px);
          padding-top: 18px;
        }

        .topbar,
        .card-actions {
          align-items: stretch;
          flex-direction: column;
        }

        .summary,
        .products,
        .metrics {
          grid-template-columns: 1fr;
        }

        .product-card {
          min-height: auto;
        }

        .cta {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <path d="M3 10.5 12 5l9 5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M5 10v8.5M9.5 10v8.5M14.5 10v8.5M19 10v8.5M4 19h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </div>
          <div>
            <h1>Banking Products Dashboard</h1>
            <p>Unified view across accounts, cards, lending, and investing.</p>
          </div>
        </div>
      </header>

      <section class="summary" aria-label="Portfolio summary">
        <article class="summary-item">
          <p class="summary-label">Total Products</p>
          <p class="summary-value" id="totalProducts">0</p>
        </article>
        <article class="summary-item">
          <p class="summary-label">Available Balance</p>
          <p class="summary-value">$24,850</p>
        </article>
        <article class="summary-item">
          <p class="summary-label">Credit Available</p>
          <p class="summary-value">$12,400</p>
        </article>
        <article class="summary-item">
          <p class="summary-label">Next Due</p>
          <p class="summary-value">Aug 28</p>
        </article>
      </section>

      <section class="toolbar" aria-label="Product filters">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m21 21-4.35-4.35M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span class="sr-only">Search products</span>
          <input id="searchInput" type="search" placeholder="Search by product, category, status, or metric" autocomplete="off" />
        </label>
        <div class="filters" id="filters" role="tablist" aria-label="Product categories"></div>
      </section>

      <section class="products" id="products" aria-live="polite"></section>
      <p class="empty" id="emptyState">No products match the current filters.</p>
    </main>

    <script>
      const products = [
        {
          name: "Everyday Savings",
          category: "Savings",
          status: "Active",
          metrics: [
            ["Balance", "$24,850"],
            ["Interest Rate", "4.25% APY"],
          ],
          action: "View Details",
          updated: "Updated today",
          icon: "wallet",
        },
        {
          name: "Platinum Rewards Card",
          category: "Credit Card",
          status: "Active",
          metrics: [
            ["Available Limit", "$12,400"],
            ["Payment Due", "Aug 28"],
          ],
          action: "Pay or View",
          updated: "Statement ready",
          icon: "card",
        },
        {
          name: "Home Advantage Loan",
          category: "Loan",
          status: "Active",
          metrics: [
            ["Outstanding", "$186,200"],
            ["Next EMI", "$1,420"],
          ],
          action: "View Loan",
          updated: "Due Sep 01",
          icon: "home",
        },
        {
          name: "Growth Wealth Portfolio",
          category: "Wealth",
          status: "Pending",
          metrics: [
            ["Portfolio Value", "$38,920"],
            ["YTD Return", "+7.8%"],
          ],
          action: "Review Plan",
          updated: "Risk review pending",
          icon: "chart",
        },
        {
          name: "Auto Flex Loan",
          category: "Loan",
          status: "Paused",
          metrics: [
            ["Approved Amount", "$32,000"],
            ["Offer Expires", "Sep 15"],
          ],
          action: "Resume",
          updated: "Application saved",
          icon: "auto",
        },
      ];

      const iconPaths = {
        wallet: '<path d="M19 7V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1" /><path d="M16 12h5v4h-5a2 2 0 0 1 0-4Z" />',
        card: '<rect x="3" y="5" width="18" height="14" rx="2" /><path d="M3 10h18M7 15h4" />',
        home: '<path d="M3 11 12 4l9 7" /><path d="M5 10v10h14V10" /><path d="M9 20v-6h6v6" />',
        chart: '<path d="M4 19V5" /><path d="M4 19h16" /><path d="m8 15 3-4 3 2 4-7" />',
        auto: '<path d="M5 16h14l-1.5-5a3 3 0 0 0-2.9-2H9.4a3 3 0 0 0-2.9 2L5 16Z" /><path d="M7 16v2M17 16v2M8 12h8" />',
      };

      const productsEl = document.querySelector("#products");
      const filtersEl = document.querySelector("#filters");
      const searchInput = document.querySelector("#searchInput");
      const emptyState = document.querySelector("#emptyState");
      const totalProducts = document.querySelector("#totalProducts");
      const categories = ["All", ...new Set(products.map((product) => product.category))];
      let selectedCategory = "All";

      function icon(name) {
        return `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${iconPaths[name]}</svg>`;
      }

      function renderFilters() {
        filtersEl.innerHTML = categories
          .map(
            (category) =>
              `<button class="filter-button${category === selectedCategory ? " active" : ""}" type="button" role="tab" aria-selected="${category === selectedCategory}" data-category="${category}">${category}</button>`,
          )
          .join("");
      }

      function productMatches(product, query) {
        const searchable = [
          product.name,
          product.category,
          product.status,
          product.updated,
          ...product.metrics.flat(),
        ]
          .join(" ")
          .toLowerCase();
        return searchable.includes(query);
      }

      function renderProducts() {
        const query = searchInput.value.trim().toLowerCase();
        const visibleProducts = products.filter((product) => {
          const categoryMatch = selectedCategory === "All" || product.category === selectedCategory;
          return categoryMatch && productMatches(product, query);
        });

        totalProducts.textContent = String(visibleProducts.length);
        emptyState.classList.toggle("visible", visibleProducts.length === 0);

        productsEl.innerHTML = visibleProducts
          .map(
            (product) => `
              <article class="product-card">
                <div>
                  <div class="card-head">
                    <div class="icon">${icon(product.icon)}</div>
                    <span class="status ${product.status.toLowerCase()}">${product.status}</span>
                  </div>
                  <p class="category">${product.category}</p>
                  <h2>${product.name}</h2>
                  <div class="metrics">
                    ${product.metrics
                      .map(
                        ([label, value]) => `
                          <div class="metric">
                            <span>${label}</span>
                            <strong>${value}</strong>
                          </div>
                        `,
                      )
                      .join("")}
                  </div>
                </div>
                <div class="card-actions">
                  <span class="updated">${product.updated}</span>
                  <button class="cta" type="button">${product.action}</button>
                </div>
              </article>
            `,
          )
          .join("");
      }

      filtersEl.addEventListener("click", (event) => {
        const button = event.target.closest("button[data-category]");
        if (!button) return;
        selectedCategory = button.dataset.category;
        renderFilters();
        renderProducts();
      });

      searchInput.addEventListener("input", renderProducts);

      renderFilters();
      renderProducts();
    </script>
  </body>
</html>
